# Deploys asifuddin.com whenever main changes.
#
# Why this file exists: Sveltia CMS commits straight to this repository, and
# nothing was watching. Twenty-five plates added through /admin sat on main for
# days without reaching the site, because every deploy until now was somebody
# running `wrangler deploy` by hand.
#
# The verification step is deliberate. A save from /admin can break a schema, a
# build guard or the embargo rule, and shipping a broken site is worse than
# shipping late — so the deploy runs only if `npm run verify` passes. When it
# does not, GitHub emails the failure and the live site keeps the last good
# version.
name: Deploy

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing anything.
  workflow_dispatch:

# A burst of CMS saves would otherwise start several overlapping deploys that
# finish out of order, and the site could end up on an older build than the one
# that started last. Cancel the earlier run instead.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The reproduction snippets are executed by `verify-snippets`, so the
      # runner needs a Python that matches the one their output was recorded
      # under (spec I-4).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: npm ci

      # Checked before the build rather than after, so a missing credential
      # costs ten seconds instead of three minutes — and so the failure email
      # says what to do instead of showing a raw wrangler stack trace.
      - name: Check the deploy credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          # The value is masked by GitHub; its length is not, and that is the
          # one fact that separates "the secret never arrived" from "the secret
          # arrived and Cloudflare refused it".
          echo "token characters visible to this job: ${#CLOUDFLARE_API_TOKEN}"
          echo "account id characters visible to this job: ${#CF_ACCOUNT_ID}"

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            {
              echo "### Deploy blocked — no API token"
              echo ""
              echo "This job received an empty \`CLOUDFLARE_API_TOKEN\`, so the site"
              echo "cannot be deployed. Everything else in this run passed."
              echo ""
              echo "If you have already added the secret, it is almost certainly in the"
              echo "wrong one of GitHub's four secret stores. A workflow can only read"
              echo "**Actions → Repository secrets**. Secrets added under *Dependabot*,"
              echo "*Codespaces*, or an *Environment* are invisible here."
              echo ""
              echo "Check <https://github.com/asifuddin01/portfolio/settings/secrets/actions>"
              echo "and confirm the name appears under **Repository secrets**, spelled"
              echo "exactly \`CLOUDFLARE_API_TOKEN\` — no spaces, no CF_ prefix."
              echo ""
              echo "If it is missing: **New repository secret**, paste a token created"
              echo "from the **Edit Cloudflare Workers** template at"
              echo "<https://dash.cloudflare.com/profile/api-tokens>."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No CLOUDFLARE_API_TOKEN secret. See the job summary for the two steps that fix it."
            exit 1
          fi

          # An account id is only needed when the token can reach more than one
          # account. Passing it as an empty string is worse than not passing it,
          # so it is exported only when actually set.
          if [ -n "$CF_ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID"; fi

          OUT=$(npx wrangler whoami 2>&1)
          if [ $? -ne 0 ]; then
            {
              echo "### Deploy blocked — the token was rejected"
              echo ""
              echo "\`wrangler whoami\` failed, so the token is missing, expired, or"
              echo "lacks the Workers permission. Its output:"
              echo ""
              echo '```'
              echo "$OUT"
              echo '```'
              echo ""
              echo "Recreate it from the **Edit Cloudflare Workers** template at"
              echo "<https://dash.cloudflare.com/profile/api-tokens> and replace the"
              echo "\`CLOUDFLARE_API_TOKEN\` secret."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The Cloudflare token was rejected. See the job summary."
            exit 1
          fi

          if echo "$OUT" | grep -qi "more than one account\|multiple accounts"; then
            {
              echo "### Deploy blocked — the token reaches several accounts"
              echo ""
              echo "Add a second secret \`CLOUDFLARE_ACCOUNT_ID\` naming the account"
              echo "that owns the \`portfolio\` Worker, then re-run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID. See the job summary."
            exit 1
          fi

          echo "Token accepted."

      - name: Verify
        run: npm run verify

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID"; fi
          # Verify built dist a moment ago, but assert it rather than assume it:
          # wrangler uploads the directory as it finds it and cannot tell that
          # it predates the content it is meant to serve.
          npm run check:dist
          npx wrangler deploy

      - name: Report
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "<https://asifuddin.com> now serves \`${GITHUB_SHA:0:7}\`."
          } >> "$GITHUB_STEP_SUMMARY"
