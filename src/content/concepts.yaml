# The controlled concept vocabulary (spec §6.3).
#
# Every chapter declares what it `owns` — derives, from first principles — and
# what it `borrows` — uses, having been derived elsewhere. Two chapters
# claiming the same concept in `owns` fails the build. That is invariant I-9,
# and it is the rule that stops the same idea being taught twice in two Books
# and drifting apart until the reader trusts neither treatment.
#
# Adding a concept here is a deliberate act. The friction is the point: it is
# exactly what prevents an accidental second treatment.
#
# A concept carrying an `apparatus:` anchor is owned by Book 0 rather than by
# any chapter. Chapters may borrow it freely; none may claim to own it.

