        hint: "A drawing for the entry, from the same library the Elementa uses."
      - label: References
        name: links
        widget: list
        required: false
        fields:
          - { label: Title, name: title, widget: string }
          - label: Link
            name: url
            widget: string
            required: false
            pattern:
              - "^\\s*$|^(https?://)?[\\w.-]+\\.[a-z]{2,}(/\\S*)?\\s*$"
              - "Paste the address only, e.g. https://example.com/page — not a sentence."
        hint: "Papers, weights, code. Listed under the entry."
      - label: Review
        name: body
        widget: markdown
        hint: "Use the image button in the toolbar to upload and place pictures."

  # ------------------------------------------------------------------
  - name: books
    label: Elementa books
    label_singular: Book
    description: >-
      The books the propositions are filed under. Add one here first, then it appears in the Book list when you write a proposition.
    folder: src/content/books
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{order}} · {{title}}"
    sortable_fields: [ order, title ]
    fields:
      - label: Book numeral
        name: id
        widget: string
        pattern:
          - "^(0|I{1,3}|IV|VI{0,2}|V)$"
          - "Roman, one of 0 I II III IV V VI VII."
        hint: >-
          The book's permanent identifier. Every chapter, equation and problem ID in the corpus is built on this letter, so it must never change once anything is published — reordering the shelf is a display decision, identity is not.
      - label: Title
        name: title
        widget: string
        hint: "Foundations, Vision, Causal inference, Bioinformatics…"
      - label: Covers
        name: covers
        widget: string
        hint: "The short line under the title, e.g. DAGs, interventions, counterfactuals."
      - label: Goal
        name: goal
        widget: text
        required: false
        hint: "What the reader can do once the book is finished."
      - label: Prerequisites
        name: prerequisites
        widget: relation
        collection: books
        search_fields: [title]
        display_fields: [title]
        value_field: "{{slug}}"
        multiple: true
        required: false
        hint: "Books that should be read first."
      - label: Mathematics assumed
        name: mathPrerequisites
        widget: list
        required: false
        field: { label: Apparatus entry, name: ref, widget: string }
        hint: >-
          Book 0 entries the reader will want, e.g. 0.MC.07. Not a gate — a reader may start on day one and follow the links when a step stops making sense.
      - label: Synthesis
        name: synthesis
        widget: text
        required: false
        hint: "How the chapters compose into one idea."
      - label: Research frontier
        name: frontier
        widget: text
        required: false
        hint: "What is still unsolved in this field."
      - label: Practical connection
        name: practical
        widget: object
        required: false
        collapsed: true
        hint: >-
          The implementation exercise that follows the book. Its rule: your code must reproduce the hand-computed numbers to four decimal places before you move on.
        fields:
          - { label: Implement, name: implement, widget: text }
          - label: Verified against
            name: verifiedAgainst
            widget: list
            required: false
            field: { label: Problem ID, name: id, widget: string }
            hint: "Problem IDs whose numbers the implementation has to reproduce, e.g. I.5.B01."
          - { label: Note, name: note, widget: text, required: false }
          - label: Laboratory
            name: laboratory
            widget: list
            required: false
            hint: >-
              Things to go and run. Kept apart from the problem set on purpose: a worked problem is checked against arithmetic, a laboratory exercise against a machine.
            fields:
              - { label: Task, name: task, widget: text }
              - { label: Note, name: note, widget: text, required: false }
      - label: Reading order
        name: order
        widget: number
        value_type: int
        min: 1
        hint: >-
          Sort order only. Gaps are fine — the Book numeral on the page is worked out from the running order, not from this value.
      - label: Closing plate
        name: closingFigure
        widget: select
        required: false
        options:
          - FigPipelineHierarchiRetina
          - FigModelAsFunction
          - FigTensorShape
          - FigParameterSpace
          - FigLossLandscape
          - FigGeneralisation
          - FigHyperplane
          - FigSignedDistance
          - FigPerceptronUpdate
          - FigXorSquare
          - FigLossShapes
          - FigLossIsALikelihood
          - FigGradientCancellation
          - FigSaturation
          - FigDeadUnit
          - FigSmoothVsKink
          - FigNeuron
          - FigDepthFolds
          - FigComputationalGraph
          - FigDescentStep
          - FigRegularisation
          - FigTokenBoundary
          - FigBPEMerge
          - FigEmbeddingSpace
          - FigContextualisation
          - FigRecurrentState
          - FigVanishingGradient
          - FigGating
          - FigDilation
          - FigSequenceLineage
          - FigAttentionWeights
          - FigQKV
          - FigSoftmaxTemperature
          - FigSelfVsCross
          - FigAttentionCost
          - FigPermutation
          - FigSinusoid
          - FigRoPE
          - FigExtrapolation
          - FigTransformerBlock
          - FigMultiHead
          - FigResidualStream
          - FigPrePostNorm
          - FigCausalMask
          - FigEncoderDecoder
          - FigBatchNoise
          - FigSchedule
          - FigClipping
          - FigPrecision
          - FigSplitLeak
          - FigTransformerMap
          - FigGramAnchoring
          - FigFcmaeGrn
          - FigConvHandback
          - FigLinearProbe
          - FigFingerprint
          - FigScalingFlat
          - FigQwenLadder
          - FigOpenVsApi
          - FigPresenceToken
          - FigKvCache
          - FigPricePerTask
          - FigTotalVsActive
          - FigContextClaim
          - FigFlopsVsLatency
          - FigContextResolution
          - FigAffinityGap
          - FigDataCrossover
          - FigCountLikelihood
          - FigTwoBenchmarks
          - FigStripedHyena
          - FigImageTensor
          - FigShuffleDestroys
          - FigNormalisation
          - FigKernelSlide
          - FigPaddingStride
          - FigReceptiveGrowth
          - FigPooling
          - FigCnnLineage
          - FigFeatureHierarchy
          - FigTransferFreeze
          - FigPretrainStart
          - FigPretextTask
          - FigImageToPatches
          - FigPatchSize
          - FigPatchPosition
          - FigSwinWindows
          - FigCollapse
          - FigAugmentationInvariance
          - FigStopGradient
          - FigMaskedImage
          - FigOneImageManyTasks
          - FigDetectionHeads
          - FigSegDecoder
          - FigDepthAmbiguity
          - FigRetrievalSpace
          - FigModalities
          - FigRocSweep
          - FigOperatingPoint
          - FigCalibrationCurve
          - FigDomainShift
          - FigVisionMap
        hint: "The one drawing that holds the whole book. Shown at the top of the closing page."
      - label: Closing
        name: closing
        widget: object
        required: false
        collapsed: true
        hint: >-
          The apparatus at the end of the book, published at /elementa/<book>/closing. Every part is optional — leave a list empty and its section simply does not appear.
        fields:
          - label: Key equations
            name: equations
            widget: list
            required: false
            fields:
              - { label: Name, name: name, widget: string }
              - label: Formula
                name: formula
                widget: string
                hint: "Plain text, set in the mono face."
              - { label: Note, name: note, widget: text, required: false }
          - label: Vocabulary
            name: vocabulary
            widget: list
            required: false
            fields:
              - { label: Term, name: term, widget: string }
              - { label: Definition, name: definition, widget: text }
          - label: Misconceptions
            name: misconceptions
            widget: list
            required: false
            hint: "Stated the way it is usually said, then corrected. Both halves are the point."
            fields:
              - { label: What is said, name: wrong, widget: text }
              - { label: What is true, name: right, widget: text }
          - label: Key derivations
            name: derivations
            widget: list
            required: false
            hint: >-
              What the reader should now be able to reproduce unaided, on paper. This list, not the reading, is the proof that the book was finished.
            fields:
              - { label: Result, name: result, widget: text }
              - { label: From, name: from, widget: text, required: false }
          - label: Recommended papers
            name: papers
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string }
              - label: Link
                name: url
                widget: string
                required: false
                pattern:
                  - "^\\s*$|^(https?://)?[\\w.-]+\\.[a-z]{2,}(/\\S*)?\\s*$"
                  - "Paste the address only, e.g. https://example.com/page — not a sentence."
              - { label: Note, name: note, widget: text, required: false }
          - label: Bridge to the next books
            name: bridge
            widget: text
            required: false
            hint: "What the books after this one do with it."
      - label: Status
        name: status
        widget: select
        default: published
        options:
          - { label: "Draft — hidden from the live site", value: draft }
          - { label: "In review — live, mathematics not yet to quota", value: review }
          - { label: "Published", value: published }
      - label: Closing prose
        name: body
        widget: markdown
        hint: "Opens the closing page, above the plate."

  # ------------------------------------------------------------------
  - name: chapters
    label: Elementa chapters
    label_singular: Chapter
    description: >-
      Chapters sit between a book and its propositions. Create the chapter
      first; a proposition then picks it from a list, and its book follows.
    folder: src/content/chapters
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: title
    slug: "{{fields.book}}--{{slug}}"
    summary: "{{book}} · {{order}} · {{title}}"
    sortable_fields: [order, title]
    fields:
      - label: Book
        name: book
        widget: relation
        collection: books
        search_fields: [title]
        display_fields: [title]
        value_field: "{{slug}}"
      - label: Chapter ID
        name: id
        widget: string
        pattern:
          - "^(0|I{1,3}|IV|VI{0,2}|V)\\.\\d+$"
          - "Book numeral, a dot, the chapter number — e.g. I.5."
        hint: >-
          Permanent, and citable from any other book. Equations, problems and propositions are all numbered beneath it, so it must not change once anything is published.
      - { label: Title, name: title, widget: string }
      - label: Summary
        name: summary
        widget: text
        hint: "One line. What the chapter is for."
      - label: The claim
        name: claim
        widget: text
        required: false
        hint: >-
          The chapter's one-sentence thesis. A title is not a claim: "Attention" has failed, "attention is a content-dependent weighted aggregation" has not.
      - label: Mathematical density
        name: mathTier
        widget: select
        default: M1
        options:
          - { label: "M0 — Narrative. Nothing is derived.", value: M0 }
          - { label: "M1 — Definitional. Mathematics defines and stops there.", value: M1 }
          - { label: "M2 — Substantive. The derivations are the chapter.", value: M2 }
          - { label: "M3 — Load-bearing. The content is mathematics.", value: M3 }
        hint: >-
          A claim about the chapter's content, and the build enforces its consequences. M2 owes 3 worked problems and 6 exercises; M3 owes 5 problems across 4 distinct variants and 10 exercises. M3 is expensive on purpose.
      - label: Why not M3
        name: tierRationale
        widget: text
        required: false
        hint: >-
          Required when a chapter about a mechanism is set below M3. If you cannot write this line, the chapter is M3.
      - label: Topics
        name: topics
        widget: list
        required: false
        field: { label: Topic, name: topic, widget: string }
        hint: >-
          What the chapter will cover. Shown before any proposition exists, so
          a reader can see the plan for a chapter that is not written yet.

      # ── BASICS — what the words mean ─────────────────────────────────
      - label: Before you start
        name: beforeYouStart
        widget: list
        required: false
        field: { label: ID, name: ref, widget: string }
        hint: >-
          Three to six prior results the chapter assumes — chapter IDs like I.6, proposition IDs like II.3.P01, or Apparatus entries like 0.MC.07. This block is what lets a reader who already knows the material enter in the middle and follow the links backwards.
      - label: Definitions
        name: definitions
        widget: list
        required: false
        hint: >-
          Stipulative and precise. "A computational graph is a directed acyclic graph whose nodes are operations" — not "computational graphs are a useful way to think about networks". The test is whether a reader can afterwards tell what does not count as one.
        fields:
          - { label: Number, name: n, widget: number, value_type: int, min: 1 }
          - { label: Term, name: term, widget: string }
          - { label: Statement, name: statement, widget: text }
          - label: Introduces
            name: introduces
            widget: list
            required: false
            field: { label: Registry key, name: symbol, widget: string }
            hint: "Symbols this definition brings in, as keys from notation.yaml."

      # ── CONCEPT — what to picture ────────────────────────────────────
      - label: The problem
        name: problemStatement
        widget: text
        required: false
        hint: >-
          Why the mechanism is necessary, stated before the mechanism. A mechanism introduced before its problem is memorised, not understood.
      - label: Concept figure
        name: conceptFigure
        widget: string
        required: false
        hint: >-
          One drawing a reader could redraw from memory — a Type A or Type C figure from src/lib/figures.ts. Required at every tier before a chapter can be published.

      # ── THEORY — why it works, and when it does not ──────────────────
      - label: Formal results
        name: formalResults
        widget: list
        required: false
        hint: >-
          A theorem, criterion, bound or impossibility, stated precisely. Every one carries what it does NOT promise, and that field is the difference between teaching theory and quoting it.
        fields:
          - { label: ID, name: id, widget: string, hint: "Chapter ID, dot, T and a number — e.g. I.6.T1." }
          - { label: Name, name: name, widget: string }
          - { label: Statement, name: statement, widget: text }
          - label: What this does not promise
            name: doesNotPromise
            widget: text
            hint: >-
              Mandatory. Universal approximation does not promise a learnable width; backdoor adjustment does not promise the graph is right.
      - label: Assumptions
        name: assumptions
        widget: list
        required: false
        hint: "Each paired with the problem that shows what its removal costs. An assumption nobody tests is a disclaimer."
        fields:
          - { label: Assumption, name: statement, widget: text }
          - { label: Tested by, name: testedBy, widget: string, hint: "A problem or exercise ID, e.g. I.6.X09." }

      # ── PLACEMENT — one mechanism, one home ──────────────────────────
      - label: Owns
        name: owns
        widget: list
        required: false
        field: { label: Concept, name: concept, widget: string }
        hint: >-
          Concepts this chapter derives from first principles, as keys from src/content/concepts.yaml. Two chapters claiming the same concept fails the build — that is what stops one idea being taught twice in two books and drifting apart.
      - label: Borrows
        name: borrows
        widget: list
        required: false
        field: { label: Concept, name: concept, widget: string }
        hint: "Concepts this chapter uses but does not derive. Somewhere else owns them."

      # ── PRACTICE — build it, break it, read the papers ───────────────
      - label: Has a runnable implementation
        name: implementation
        widget: boolean
        default: false
        hint: "At most 25 lines, no framework magic, reproducing a worked problem's numbers."
      - label: Failure modes
        name: failureModes
        widget: list
        required: false
        field: { label: Failure, name: mode, widget: text }
        hint: >-
          Concrete. Not "CNNs can struggle with rotation" but an input and a number.
      - label: Sources
        name: references
        widget: list
        required: false
        hint: "Authors, year and venue on every one — a claim about a paper carries all three."
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Authors, name: authors, widget: string }
          - { label: Year, name: year, widget: number, value_type: int }
          - { label: Venue, name: venue, widget: string }
          - label: Link
            name: url
            widget: string
            required: false
            pattern:
              - "^\\s*$|^(https?://)?[\\w.-]+\\.[a-z]{2,}(/\\S*)?\\s*$"
              - "Paste the address only, not a sentence." 
      - label: Notation
        name: notation
        widget: list
        required: false
        field: { label: Registry key, name: symbol, widget: string }
        hint: >-
          Keys from src/content/notation.yaml — d_k, tau, nabla. A symbol absent from the registry, or one the registry says is introduced in a later chapter, fails the build.
      - label: Apparatus
        name: apparatus
        widget: list
        required: false
        field: { label: Entry, name: ref, widget: string }
        hint: "Book 0 anchors this chapter leans on, e.g. 0.MC.07."
      - label: Numbered equations
        name: keyEquations
        widget: list
        required: false
        hint: >-
          Number an equation only if something later refers to it. The gloss names what the equation says, not what it contains — not "softmax of QK transpose" but "each output row is a convex combination of value rows".
        fields:
          - { label: ID, name: id, widget: string, hint: "Chapter ID, dot, number — e.g. I.5.4." }
          - { label: Formula, name: formula, widget: string }
          - { label: Gloss, name: gloss, widget: text }
      - label: Order
        name: order
        widget: number
        value_type: int
        min: 1
        hint: "Position within the book. Chapter numerals come from the running order."
      - label: Status
        name: status
        widget: select
        default: review
        options:
          - { label: "Draft — hidden from the live site", value: draft }
          - { label: "In review — live, mathematics not yet to quota", value: review }
          - { label: "Published — the quota guard now enforces the tier", value: published }
        hint: >-
          Publishing is the commitment. From that moment the build refuses to pass until the chapter meets every number its tier demands.

  # ------------------------------------------------------------------
  - name: problems
    label: Elementa problems
    label_singular: Problem or exercise
    description: >-
      The mathematical spine. A worked problem is a document with a fixed
      anatomy, not free prose: statement, given, find, strategy, solution,
      answer, two checks, where it breaks. Write it with the components —
      <Statement>, <Given>, <Find>, <Strategy>, <Solution>, <Answer>,
      <CheckNumeric>, <CheckSanity>, <Breaks>, <Variation> — and the page
      renders the template for you.
    folder: src/content/problems
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: title
    slug: "{{fields.id}}-{{slug}}"
    summary: "{{id}} · {{variant}} — {{title}}"
    sortable_fields: [ id, variant, difficulty ]
    fields:
      - label: ID
        name: id
        widget: string
        pattern:
          - "^(0|I{1,3}|IV|VI{0,2}|V)\\.(\\d+|BOOK)\\.[BX]\\d{2}$"
          - "Chapter, then B for a problem or X for an exercise, then two digits — e.g. I.5.B03 or I.5.X07."
        hint: >-
          Numbered per chapter and never per proposition, because a problem may draw on several. A deleted number is retired, not reused.
      - label: Kind
        name: kind
        widget: select
        default: problem
        options:
          - { label: "Worked problem — you show the work", value: problem }
          - { label: "Exercise — the reader does the work", value: exercise }
      - label: Chapter
        name: chapter
        widget: string
        hint: "The chapter ID, e.g. I.5 — or I.BOOK for a book-level item."
      - label: Scope
        name: scope
        widget: select
        default: chapter
        options:
          - { label: "Chapter", value: chapter }
          - { label: "Book — combines two or more chapters", value: book }
          - { label: "Cross-book — reaches back into an earlier book", value: cross-book }
      - label: Variant
        name: variant
        widget: select
        options:
          - { label: "numeric — compute the mechanism end to end, by hand", value: numeric }
          - { label: "symbolic — derive a closed form from the definitions", value: symbolic }
          - { label: "shape — track tensor shapes; find the error", value: shape }
          - { label: "gradient — a derivative, Jacobian or backward rule", value: gradient }
          - { label: "limit — behaviour as a parameter goes to 0, 1 or ∞", value: limit }
          - { label: "counterexample — build an input that breaks the claim", value: counterexample }
          - { label: "complexity — FLOPs, memory, parameters, intensity", value: complexity }
          - { label: "probability — expectation, variance, estimator, likelihood", value: probability }
          - { label: "proof — establish a result, or show it cannot be done", value: proof }
        hint: >-
          Nine variants, and a chapter must span several of them. Five problems of one variant are one problem repeated, and the build says so.
      - label: Difficulty
        name: difficulty
        widget: select
        default: 2
        options:
          - { label: "▲△△ mechanical — apply the definition once", value: 1 }
          - { label: "▲▲△ composite — combine two or three results", value: 2 }
          - { label: "▲▲▲ research-adjacent — the step is not in the text", value: 3 }
      - { label: Title, name: title, widget: string }
      - label: Draws on
        name: depends
        widget: list
        required: false
        field: { label: Proposition ID, name: ref, widget: string }
        hint: "Proposition IDs like I.5.P04. This is what puts the problem on that proposition's page."
      - label: Reaches back into
        name: reachesBack
        widget: list
        required: false
        field: { label: Chapter ID, name: ref, widget: string }
        hint: "Chapter IDs in EARLIER books. Required when the scope is cross-book."
      - label: Rounding
        name: rounding
        widget: string
        required: false
        hint: "Stated once at the top and applied consistently, e.g. 'All values rounded to 4 d.p.'"
      - label: Has a published solution
        name: hasSolution
        widget: boolean
        default: false
        hint: >-
          Elementa has no answer-less items. A hidden solution is a solution; a missing one is an abandonment, and the build refuses to ship one.
      - label: Verified
        name: verified
        widget: boolean
        default: false
        hint: "The reproduction snippet was executed and its output matched. Required for any variant that prints numbers."
      - label: Snippet
        name: snippet
        widget: string
        required: false
        hint: "Filename under scripts/snippets. Run on every build and diffed against its .expected.txt."
      - label: Status
        name: status
        widget: select
        default: draft
        options:
          - { label: "Draft — hidden from the live site", value: draft }
          - { label: "In review", value: review }
          - { label: "Published", value: published }
      - label: The problem
        name: body
        widget: markdown
        hint: >-
          Use the template components. Every algebraic step is a line: if a step took you thought, it takes the reader a line.

  # ------------------------------------------------------------------
  - name: apparatus
    label: Book 0 · Apparatus
    label_singular: Entry
    description: >-
      The mathematics the other seven books assume. One screen, never more.
      An entry that only one chapter needs does not belong here — it belongs
      in that chapter.
    folder: src/content/apparatus
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: title
    slug: "{{fields.id}}-{{slug}}"
    summary: "{{id}} — {{title}}"
    sortable_fields: [ id, order, title ]
    fields:
      - label: ID
        name: id
        widget: string
        pattern:
          - "^0\\.[A-Z]{2}\\.\\d{2}$"
          - "Zero, the two-letter part, two digits — e.g. 0.MC.07."
      - label: Part
        name: part
        widget: select
        options:
          - { label: "0.LA — Linear Algebra", value: LA }
          - { label: "0.MC — Matrix Calculus", value: MC }
          - { label: "0.PR — Probability", value: PR }
          - { label: "0.IT — Information Theory", value: IT }
          - { label: "0.OP — Optimisation", value: OP }
          - { label: "0.ST — Statistics", value: ST }
          - { label: "0.NU — Numerics", value: NU }
          - { label: "0.GR — Graph Theory", value: GR }
      - label: Order
        name: order
        widget: number
        value_type: int
        min: 1
      - { label: Title, name: title, widget: string }
      - label: Statement
        name: statement
        widget: text
        hint: "The result itself, stated once."
      - label: Shape check
        name: shapeCheck
        widget: text
        required: false
        hint: "Why the shapes conform. Usually the line the reader actually came for."
      - label: Worked line
        name: workedLine
        widget: text
        required: false
        hint: "One three-line instantiation. Never longer."
      - label: Status
        name: status
        widget: select
        default: review
        options:
          - { label: "Draft — hidden from the live site", value: draft }
          - { label: "In review", value: review }
          - { label: "Published", value: published }
      - label: Note
        name: body
        widget: markdown
        required: false
        hint: "Why the fact is worth having, in a paragraph or two."

  # ------------------------------------------------------------------
  - name: elementa
    label: Elementa
    label_singular: Proposition
    description: >-
      The teaching corpus. Every proposition needs a figure; if the figure cannot be drawn, the proposition is not ready to be written.
    folder: src/content/elementa
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: statement
    slug: "{{slug}}"
    summary: "{{chapter}} · Prop {{proposition}} — {{statement}}"
    sortable_fields: [ chapter, proposition, updated ]
    fields:
      - label: Chapter
        name: chapter
        widget: relation
        collection: chapters
        search_fields: [ title ]
        display_fields: [ title ]
        value_field: "{{slug}}"
        hint: >-
          The book follows from the chapter, so a proposition can never disagree with its own book about where it lives. Add the chapter under Elementa chapters first if it is missing.
      - label: Proposition number
        name: proposition
        widget: number
        value_type: int
        min: 1
        hint: "Numbered within the chapter, so every chapter starts again at 1."
      - label: Statement
        name: statement
        widget: string
        hint: "The claim, in one sentence. This is the page title."
      - label: The claim
        name: claim
        widget: text
        required: false
        hint: "One or two sentences stating the claim plainly, beneath the title."
      - label: Sources
        name: sources
        widget: list
        required: false
        fields:
          - { label: Title, name: title, widget: string }
          - label: Link
            name: url
            widget: string
            required: false
            pattern:
              - "^\\s*$|^(https?://)?[\\w.-]+\\.[a-z]{2,}(/\\S*)?\\s*$"
              - "Paste the address only, e.g. https://example.com/page — not a sentence."
        hint: "Primary papers and references behind the proposition."
      - label: Given
        name: given
        widget: relation
        collection: elementa
        search_fields: [ statement ]
        display_fields: [ statement ]
        value_field: "{{slug}}"
        multiple: true
        required: false
        hint: "Propositions this one depends on. Builds the dependency graph."
      - label: Figure
        name: figure
        widget: select
        required: false
        options:
          - FigPipelineHierarchiRetina
          - FigModelAsFunction
          - FigTensorShape
          - FigParameterSpace
          - FigLossLandscape
          - FigGeneralisation
          - FigHyperplane
          - FigSignedDistance
          - FigPerceptronUpdate
          - FigXorSquare
          - FigLossShapes
          - FigLossIsALikelihood
          - FigGradientCancellation
          - FigSaturation
          - FigDeadUnit
          - FigSmoothVsKink
          - FigNeuron
          - FigDepthFolds
          - FigComputationalGraph
          - FigDescentStep
          - FigRegularisation
          - FigTokenBoundary
          - FigBPEMerge
          - FigEmbeddingSpace
          - FigContextualisation
          - FigRecurrentState
          - FigVanishingGradient
          - FigGating
          - FigDilation
          - FigSequenceLineage
          - FigAttentionWeights
          - FigQKV
          - FigSoftmaxTemperature
          - FigSelfVsCross
          - FigAttentionCost
          - FigPermutation
          - FigSinusoid
          - FigRoPE
          - FigExtrapolation
          - FigTransformerBlock
          - FigMultiHead
          - FigResidualStream
          - FigPrePostNorm
          - FigCausalMask
          - FigEncoderDecoder
          - FigBatchNoise
          - FigSchedule
          - FigClipping
          - FigPrecision
          - FigSplitLeak
          - FigTransformerMap
          - FigGramAnchoring
          - FigFcmaeGrn
          - FigConvHandback
          - FigLinearProbe
          - FigFingerprint
          - FigScalingFlat
          - FigQwenLadder
          - FigOpenVsApi
          - FigPresenceToken
          - FigKvCache
          - FigPricePerTask
          - FigTotalVsActive
          - FigContextClaim
          - FigFlopsVsLatency
          - FigContextResolution
          - FigAffinityGap
          - FigDataCrossover
          - FigCountLikelihood
          - FigTwoBenchmarks
          - FigStripedHyena
          - FigImageTensor
          - FigShuffleDestroys
          - FigNormalisation
          - FigKernelSlide
          - FigPaddingStride
          - FigReceptiveGrowth
          - FigPooling
          - FigCnnLineage
          - FigFeatureHierarchy
          - FigTransferFreeze
          - FigPretrainStart
          - FigPretextTask
          - FigImageToPatches
          - FigPatchSize
          - FigPatchPosition
          - FigSwinWindows
          - FigCollapse
          - FigAugmentationInvariance
          - FigStopGradient
          - FigMaskedImage
          - FigOneImageManyTasks
          - FigDetectionHeads
          - FigSegDecoder
          - FigDepthAmbiguity
          - FigRetrievalSpace
          - FigModalities
          - FigRocSweep
          - FigOperatingPoint
          - FigCalibrationCurve
          - FigDomainShift
          - FigVisionMap
        hint: "Registered in src/lib/figures.ts, and checked against it by `npm run check:cms`. A new figure needs a developer."
      - label: Figure type
        name: figureType
        widget: select
        required: false
        options:
          - { label: "A — Definition. What something is.", value: A }
          - { label: "B — Construction. How it is built, in stages.", value: B }
          - { label: "C — Flow. A process over time or layers.", value: C }
          - { label: "D — Comparison. Two approaches side by side.", value: D }
          - { label: "E — Architecture. A full model.", value: E }
          - { label: "F — Equation. The relationship, drawn.", value: F }
          - { label: "G — Failure. Where a method breaks.", value: G }
          - { label: "H — Research map. How papers and methods relate.", value: H }
        hint: >-
          Eight types, no more, so a reader learns to read the figures themselves. A load-bearing chapter must carry at least one Type F: an equation you can only parse has been taught once, one you can also see has been taught twice.
      - label: Level
        name: level
        widget: select
        default: mechanics
        options:
          - { label: "Intuition — no mathematics, and a true simplification", value: intuition }
          - { label: "Mechanics — how it works, with the derivation", value: mechanics }
          - { label: "Research — what happens past the textbook", value: research }
