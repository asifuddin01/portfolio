        name: notation
        widget: list
        required: false
        field: { label: Registry key, name: symbol, widget: string }
        hint: "Keys from src/content/notation.yaml. Checked against the registry on every build."
      - label: Apparatus
        name: apparatus
        widget: list
        required: false
        field: { label: Entry, name: ref, widget: string }
        hint: "Book 0 anchors this proposition leans on, e.g. 0.MC.03."
      - label: Status
        name: status
        widget: select
        default: draft
        options:
          - { label: "Draft — hidden from the live site", value: draft }
          - { label: "In review — live, mathematics not yet to quota", value: review }
          - { label: "Published", value: published }
      - label: Updated
        name: updated
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: Demonstration
        name: body
        widget: markdown

  # ------------------------------------------------------------------
  - name: works
    label: Plates
    label_singular: Plate
    description: >-
      The research plates. These are what the Compendium on the home page shows — add one here and a card appears there. The plate number is both the sort order and the numeral on the page, so keep them consecutive.
    folder: src/content/works
    extension: mdx
    format: frontmatter
    create: true
    delete: true
    identifier_field: title
    summary: "Plate {{plate}} — {{title}}"
    sortable_fields: [ plate ]
    fields:
      - label: Plate number
        name: plate
        widget: number
        value_type: int
        min: 1
        hint: >-
          Both the sort order and the numeral on the page — Plate 5 renders as "Plate V". Keep them consecutive so the compendium reads cleanly.
      - { label: Short title, name: title, widget: string }
      - { label: Full title, name: fullTitle, widget: text }
      - { label: Subtitle, name: subtitle, widget: string }
      - label: Status
        name: status
        widget: select
        default: in-preparation
        options:
          - { label: "In preparation", value: in-preparation }
          - { label: "Proposal accepted", value: proposal-accepted }
          - { label: "Deposited", value: deposited }
      - label: Disclosure
        name: disclosure
        widget: select
        default: embargoed
        options:
          - { label: "Embargoed — results stay off the page", value: embargoed }
          - { label: "Public — results may be shown", value: public }
        hint: >-
          EMBARGOED plates must have an empty Results table. Adding a result to an embargoed plate will deliberately fail the build so unpublished numbers cannot leak.
      - { label: Year, name: year, widget: string, default: "2026" }
      - label: Supervisors
        name: supervisors
        widget: list
        field: { label: Name, name: name, widget: string }
        hint: "At least one — the schema requires it."
      - { label: Co-authors, name: coauthors, widget: list, required: false, field: { label: Name, name: name, widget: string } }
      - { label: Datasets, name: datasets, widget: list, required: false, field: { label: Dataset, name: dataset, widget: string } }
      - label: Abstract
        name: abstract
        widget: text
        hint: "Verbatim from the paper. Never paraphrase or shorten it."
      - { label: Citation, name: citation, widget: text, required: false }
      - { label: Paper URL, name: paperUrl, widget: string, required: false, pattern: [ "^\\s*$|^(https?://)?[\\w.-]+\\.[a-z]{2,}(/\\S*)?\\s*$", "Paste the address only, e.g. https://example.com/page — not a sentence." ], hint: The address only. A sentence with a link in it will not be accepted here. }
      - { label: Repository URL, name: repoUrl, widget: string, required: false, pattern: [ "^\\s*$|^(https?://)?[\\w.-]+\\.[a-z]{2,}(/\\S*)?\\s*$", "Paste the address only, e.g. https://example.com/page — not a sentence." ], hint: The address only. A sentence with a link in it will not be accepted here. }
      - label: Results
        name: metrics
        widget: list
        required: false
        label_singular: Result
        summary: "{{fields.label}} — {{fields.value}}"
        hint: "Leave completely empty for embargoed plates. The build enforces this."
        fields:
          - { label: Measure, name: label, widget: string }
          - { label: Value, name: value, widget: string }
          - { label: Note, name: note, widget: string, required: false }
      - { label: Chapter body, name: body, widget: markdown }

  # ------------------------------------------------------------------
  - name: art
    label: Tabulae
    label_singular: Plate
    description: >-
      The artwork interleaved between the chapters. Upload an image, say where it came from, and write as much history as you like in the note.
    folder: src/content/art
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{order}} · {{title}} — {{artist}}"
    sortable_fields: [ order, title, artist ]
    # Relative to this collection's folder, so uploads land in
    # src/assets/plates and the saved path is one Astro can optimise.
    media_folder: "../../assets/plates"
    public_folder: "../../assets/plates"
    fields:
      - label: Image
        name: image
        widget: image
        hint: "Uploads are optimised automatically. Large scans are fine."
      - label: Title
        name: title
        widget: string
      - label: Artist
        name: artist
        widget: string
        default: Unknown
      - label: Date
        name: date
        widget: string
        hint: "As the source gives it, e.g. 1514, or c. 12th century."
      - label: Plate order
        name: order
        widget: number
        value_type: int
        min: 1
        hint: >-
          Sort order only. Lowest sits on the frontispiece; the rest interleave the chapters. Gaps are fine — the plate numbers on the page are worked out from the running order, not from this value.
      - label: Treatment
        name: treatment
        widget: select
        default: intaglio
        options:
          - { label: "Intaglio — line art, prints onto the page", value: intaglio }
          - { label: "Photograph — an object, toned instead", value: photograph }
        hint: >-
          Engravings and drawings on white paper should be intaglio. Photographs of sculpture or objects should be photograph, or they will go black.
      - label: Gloss
        name: gloss
        widget: text
        hint: "One line, set in italic beneath the caption."
      - label: Alt text
        name: alt
        widget: string
        required: false
        hint: "For screen readers. Leave blank to use the title and artist."
      - label: Credit
        name: credit
        widget: string
        default: "Art Institute of Chicago · CC0"
        hint: "Who holds it, and the licence. Only use images you are allowed to publish."
      - label: Source link
        name: source
        widget: string
        required: false
        pattern:
          - ^\s*$|^(https?://)?[\w.-]+\.[a-z]{2,}(/\S*)?\s*$
          - Paste the address only, e.g. https://example.com/page — not a sentence.
        hint: The address only. A sentence with a link in it will not be accepted here.
      - label: Position on the home page
        name: homePosition
        widget: number
        value_type: float
        step: 0.5
        min: 0
        default: 1
        hint: >-
          1 appears first, beside your name at the top; 2 next, and so on down
          the page. To slot a plate between two others, use a half — 3.5 puts
          it straight after 3 and moves everything below it down. Typing a
          number another plate already has leaves that one in front, so use
          the half instead.
      - label: Side
        name: side
        widget: select
        default: right
        options: [ left, right ]
        hint: "Which margin it hangs in on the home page."
      - label: Show on the home page
        name: onHome
        widget: boolean
        default: true
        hint: >-
          The only switch that decides this. Off means it stays in the Tabulae gallery but never appears on the home page.
      - label: Status
        name: status
        widget: select
        default: published
        options:
          - { label: "Draft — hidden from the live site", value: draft }
          - { label: "Published", value: published }
      - label: Note — description and historical background
        name: body
        widget: markdown
        # Refuses the save rather than the deploy. Both of these look correct in
        # the editor and are only wrong once published — a pasted address has
        # expired by the time a reader arrives, and a picture with no
        # description is one the accessibility audit will not publish. Catching
        # them here means catching them while the file is still to hand.
        pattern:
          - ^(?![\s\S]*!\[[^\]]*\]\(\s*<?https?:\/\/)(?![\s\S]*!\[\s*\]\()[\s\S]*$
          - >-
            A picture in this note is not ready yet. Either it points at
            someone else's website — those addresses stop working within a day,
            so upload the file instead — or it has no description. Click the
            picture and fill in the description field: one plain sentence
            saying what is in it.
        hint: >-
          Where it came from, what is happening in it, why it is here. To put a
          second picture inside the note, click where you want it and use the
          image button — it uploads the file into the site and drops it at the
          cursor, and that is where it appears on the page. Do not paste a
          picture's web address: an address copied out of a chat or a search
          result stops working within a day and the page publishes with a hole
          in it, so the site refuses to build on one.

  # ------------------------------------------------------------------
  - name: axioms
