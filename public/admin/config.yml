# Sveltia CMS — the editing interface at /admin.
#
# Content is committed straight to the repository as MDX, so nothing here is a
# separate database: what you edit is what the site is built from. Saving
# triggers a rebuild on Cloudflare Pages, live in a minute or two.

backend:
  name: github
  repo: asifuddin01/portfolio
  branch: main
  # The auth worker in worker/. Deployed, so the "Sign in with GitHub"
  # button works on the live site.
  base_url: https://codex-auth.asif-uddin-r1.workers.dev

  # Lets you edit locally with `npm run dev` and no login at all.
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://asifuddin.com
display_url: https://asifuddin.com

collections:
  # ------------------------------------------------------------------
  - name: marginalia
    label: Marginalia
    label_singular: Entry
    description: >-
      Book reviews, model reviews, essays and notes. Newest folio number appears first on the site.
    folder: src/content/marginalia
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{entry}} · {{kind}} — {{title}}"
    sortable_fields: [ entry, updated, title ]
    view_groups:
      - label: Kind
        field: kind
    fields:
      - label: Kind
        name: kind
        widget: select
        default: book
        options:
          - { label: "Book review", value: book }
          - { label: "Research paper review", value: paper }
          - { label: "Model review", value: model }
          - { label: "Essay", value: essay }
          - { label: "Note", value: note }
      - label: Title
        name: title
        widget: string
        hint: "The headline. Assert something — it becomes the page title."
      - label: Subject
        name: subject
        widget: string
        hint: "What is under review, e.g. 'Judea Pearl — The Book of Why'."
      - label: Summary
        name: summary
        widget: text
        hint: "One line. Shown under the title in the index."
      - label: Folio number
        name: entry
        widget: number
        value_type: int
        min: 1
        hint: "Running number. Use the next one up from the highest existing entry."
      - label: Status
        name: status
        widget: select
        default: draft
        options:
          - { label: "Draft — hidden from the live site", value: draft }
          - { label: "Published", value: published }
      - label: Date
        name: updated
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: Source link
        name: source
        widget: string
        required: false
        hint: "The address only. A sentence with a link in it will not be accepted here."
        pattern:
          - ^\s*$|^(https?://)?[\w.-]+\.[a-z]{2,}(/\S*)?\s*$
          - Paste the address only, e.g. https://example.com/page — not a sentence.
      - label: Link text
        name: sourceLabel
        widget: string
        required: false
        hint: What the link should say, e.g. "Book, free PDF and notebooks". Defaults to "Source".
      - label: Figure
        name: figure
        widget: select
        required: false
        options:
          - FigPipelineHierarchiRetina
          - FigModelAsFunction
          - FigTensorShape
          - FigParameterSpace
          - FigLossLandscape
          - FigGeneralisation
          - FigHyperplane
          - FigSignedDistance
          - FigPerceptronUpdate
          - FigXorSquare
          - FigLossShapes
          - FigLossIsALikelihood
          - FigGradientCancellation
          - FigSaturation
          - FigDeadUnit
          - FigSmoothVsKink
          - FigNeuron
          - FigDepthFolds
          - FigComputationalGraph
          - FigDescentStep
          - FigRegularisation
          - FigTokenBoundary
          - FigBPEMerge
          - FigEmbeddingSpace
          - FigContextualisation
          - FigRecurrentState
          - FigVanishingGradient
          - FigGating
          - FigDilation
          - FigSequenceLineage
          - FigAttentionWeights
          - FigQKV
          - FigSoftmaxTemperature
          - FigSelfVsCross
          - FigAttentionCost
          - FigPermutation
          - FigSinusoid
          - FigRoPE
          - FigExtrapolation
          - FigTransformerBlock
          - FigMultiHead
          - FigResidualStream
          - FigPrePostNorm
          - FigCausalMask
          - FigEncoderDecoder
          - FigBatchNoise
          - FigSchedule
          - FigClipping
          - FigPrecision
          - FigSplitLeak
          - FigTransformerMap
          - FigGramAnchoring
          - FigFcmaeGrn
          - FigConvHandback
          - FigLinearProbe
          - FigFingerprint
          - FigScalingFlat
          - FigQwenLadder
          - FigOpenVsApi
          - FigPresenceToken
          - FigKvCache
          - FigPricePerTask
          - FigTotalVsActive
          - FigContextClaim
          - FigFlopsVsLatency
          - FigContextResolution
          - FigAffinityGap
          - FigDataCrossover
          - FigCountLikelihood
          - FigTwoBenchmarks
          - FigStripedHyena
          - FigImageTensor
          - FigShuffleDestroys
          - FigNormalisation
          - FigKernelSlide
          - FigPaddingStride
          - FigReceptiveGrowth
          - FigPooling
          - FigCnnLineage
          - FigFeatureHierarchy
          - FigTransferFreeze
          - FigPretrainStart
          - FigPretextTask
          - FigImageToPatches
          - FigPatchSize
          - FigPatchPosition
          - FigSwinWindows
          - FigCollapse
          - FigAugmentationInvariance
          - FigStopGradient
          - FigMaskedImage
          - FigOneImageManyTasks
          - FigDetectionHeads
          - FigSegDecoder
          - FigDepthAmbiguity
          - FigRetrievalSpace
          - FigModalities
          - FigRocSweep
          - FigOperatingPoint
          - FigCalibrationCurve
