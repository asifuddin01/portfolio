# Sveltia CMS — the editing interface at /admin.
#
# Content is committed straight to the repository as MDX, so nothing here is a
# separate database: what you edit is what the site is built from. Saving
# triggers a rebuild on Cloudflare Pages, live in a minute or two.

backend:
  name: github
  repo: asifuddin01/portfolio
  branch: main
  # The auth worker in worker/. Deployed, so the "Sign in with GitHub"
  # button works on the live site.
  base_url: https://codex-auth.asif-uddin-r1.workers.dev

  # Lets you edit locally with `npm run dev` and no login at all.
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://asifuddin.com
display_url: https://asifuddin.com

collections:
  # ------------------------------------------------------------------
  - name: marginalia
    label: Marginalia
    label_singular: Entry
    description: >-
      Book reviews, model reviews, essays and notes. Newest folio number appears first on the site.
    folder: src/content/marginalia
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{entry}} · {{kind}} — {{title}}"
    sortable_fields: [ entry, updated, title ]
    view_groups:
      - label: Kind
        field: kind
    fields:
      - label: Kind
        name: kind
        widget: select
        default: book
        options:
          - { label: "Book review", value: book }
          - { label: "Research paper review", value: paper }
          - { label: "Model review", value: model }
          - { label: "Essay", value: essay }
          - { label: "Note", value: note }
      - label: Title
        name: title
        widget: string
        hint: "The headline. Assert something — it becomes the page title."
      - label: Subject
        name: subject
        widget: string
        hint: "What is under review, e.g. 'Judea Pearl — The Book of Why'."
      - label: Summary
        name: summary
        widget: text
        hint: "One line. Shown under the title in the index."
      - label: Folio number
        name: entry
        widget: number
        value_type: int
        min: 1
        hint: "Running number. Use the next one up from the highest existing entry."
      - label: Status
        name: status
        widget: select
        default: draft
        options:
          - { label: "Draft — hidden from the live site", value: draft }
          - { label: "Published", value: published }
      - label: Date
        name: updated
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: Source link
        name: source
        widget: string
        required: false
        hint: "The address only. A sentence with a link in it will not be accepted here."
        pattern:
          - ^\s*$|^(https?://)?[\w.-]+\.[a-z]{2,}(/\S*)?\s*$
          - Paste the address only, e.g. https://example.com/page — not a sentence.
      - label: Link text
        name: sourceLabel
        widget: string
        required: false
        hint: What the link should say, e.g. "Book, free PDF and notebooks". Defaults to "Source".
      - label: Review
        name: body
        widget: markdown
        hint: "Use the image button in the toolbar to upload and place pictures."

  # ------------------------------------------------------------------
  - name: books
    label: Elementa books
    label_singular: Book
    description: >-
      The books the propositions are filed under. Add one here first, then it appears in the Book list when you write a proposition.
    folder: src/content/books
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{order}} · {{title}}"
    sortable_fields: [ order, title ]
    fields:
      - label: Title
        name: title
        widget: string
        hint: "Foundations, Vision, Causal inference, Bioinformatics…"
      - label: Covers
        name: covers
        widget: string
        hint: "The short line under the title, e.g. DAGs, interventions, counterfactuals."
      - label: Goal
        name: goal
        widget: text
        required: false
        hint: "What the reader can do once the book is finished."
      - label: Prerequisites
        name: prerequisites
        widget: relation
        collection: books
        search_fields: [title]
        display_fields: [title]
        value_field: "{{slug}}"
        multiple: true
        required: false
        hint: "Books that should be read first."
      - label: Reading order
        name: order
        widget: number
        value_type: int
        min: 1
        hint: >-
          Sort order only. Gaps are fine — the Book numeral on the page is worked out from the running order, not from this value.
      - label: Closing plate
        name: closingFigure
        widget: select
        required: false
        options:
          - FigPipelineHierarchiRetina
          - FigModelAsFunction
          - FigTensorShape
          - FigParameterSpace
          - FigLossLandscape
          - FigGeneralisation
          - FigNeuron
          - FigDepthFolds
          - FigComputationalGraph
          - FigDescentStep
          - FigRegularisation
          - FigTokenBoundary
          - FigBPEMerge
          - FigEmbeddingSpace
          - FigContextualisation
          - FigRecurrentState
          - FigVanishingGradient
          - FigGating
          - FigDilation
          - FigSequenceLineage
          - FigAttentionWeights
          - FigQKV
          - FigSoftmaxTemperature
          - FigSelfVsCross
          - FigAttentionCost
          - FigPermutation
          - FigSinusoid
          - FigRoPE
          - FigExtrapolation
          - FigTransformerBlock
          - FigMultiHead
          - FigResidualStream
          - FigPrePostNorm
          - FigCausalMask
          - FigEncoderDecoder
          - FigBatchNoise
          - FigSchedule
          - FigClipping
          - FigPrecision
          - FigSplitLeak
          - FigTransformerMap
        hint: "The one drawing that holds the whole book. Shown at the top of the closing page."
      - label: Closing
        name: closing
        widget: object
        required: false
        collapsed: true
        hint: >-
          The apparatus at the end of the book, published at /elementa/<book>/closing. Every part is optional — leave a list empty and its section simply does not appear.
        fields:
          - label: Key equations
            name: equations
            widget: list
            required: false
            fields:
              - { label: Name, name: name, widget: string }
              - label: Formula
                name: formula
                widget: string
                hint: "Plain text, set in the mono face."
              - { label: Note, name: note, widget: text, required: false }
          - label: Vocabulary
            name: vocabulary
            widget: list
            required: false
            fields:
              - { label: Term, name: term, widget: string }
              - { label: Definition, name: definition, widget: text }
          - label: Misconceptions
            name: misconceptions
            widget: list
            required: false
            hint: "Stated the way it is usually said, then corrected. Both halves are the point."
            fields:
              - { label: What is said, name: wrong, widget: text }
              - { label: What is true, name: right, widget: text }
          - label: Exercises
            name: exercises
            widget: list
            required: false
            fields:
              - { label: Task, name: task, widget: text }
              - { label: Note, name: note, widget: text, required: false }
          - label: Recommended papers
            name: papers
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string }
              - label: Link
                name: url
                widget: string
                required: false
                pattern:
                  - "^\\s*$|^(https?://)?[\\w.-]+\\.[a-z]{2,}(/\\S*)?\\s*$"
                  - "Paste the address only, e.g. https://example.com/page — not a sentence."
              - { label: Note, name: note, widget: text, required: false }
          - label: Bridge to the next books
            name: bridge
            widget: text
            required: false
            hint: "What the books after this one do with it."
      - label: Closing prose
        name: body
        widget: markdown
        hint: "Opens the closing page, above the plate."

  # ------------------------------------------------------------------
  - name: chapters
    label: Elementa chapters
    label_singular: Chapter
    description: >-
      Chapters sit between a book and its propositions. Create the chapter
      first; a proposition then picks it from a list, and its book follows.
    folder: src/content/chapters
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: title
    slug: "{{fields.book}}--{{slug}}"
    summary: "{{book}} · {{order}} · {{title}}"
    sortable_fields: [order, title]
    fields:
      - label: Book
        name: book
        widget: relation
        collection: books
        search_fields: [title]
        display_fields: [title]
        value_field: "{{slug}}"
      - { label: Title, name: title, widget: string }
      - label: Summary
        name: summary
        widget: text
        hint: "One line. What the chapter is for."
      - label: Topics
        name: topics
        widget: list
        required: false
        field: { label: Topic, name: topic, widget: string }
        hint: >-
          What the chapter will cover. Shown before any proposition exists, so
          a reader can see the plan for a chapter that is not written yet.
      - label: Order
        name: order
        widget: number
        value_type: int
        min: 1
        hint: "Position within the book. Chapter numerals come from the running order."
      - label: Status
        name: status
        widget: select
        default: published
        options:
          - { label: "Draft — hidden from the live site", value: draft }
          - { label: "Published", value: published }

  # ------------------------------------------------------------------
  - name: elementa
    label: Elementa
    label_singular: Proposition
    description: >-
      The teaching corpus. Every proposition needs a figure; if the figure cannot be drawn, the proposition is not ready to be written.
    folder: src/content/elementa
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: statement
    slug: "{{slug}}"
    summary: "{{chapter}} · Prop {{proposition}} — {{statement}}"
    sortable_fields: [ chapter, proposition, updated ]
    fields:
      - label: Chapter
        name: chapter
        widget: relation
        collection: chapters
        search_fields: [ title ]
        display_fields: [ title ]
        value_field: "{{slug}}"
        hint: >-
          The book follows from the chapter, so a proposition can never disagree with its own book about where it lives. Add the chapter under Elementa chapters first if it is missing.
      - label: Proposition number
        name: proposition
        widget: number
        value_type: int
        min: 1
        hint: "Numbered within the chapter, so every chapter starts again at 1."
      - label: Statement
        name: statement
        widget: string
        hint: "The claim, in one sentence. This is the page title."
      - label: The claim
        name: claim
        widget: text
        required: false
        hint: "One or two sentences stating the claim plainly, beneath the title."
      - label: Sources
        name: sources
        widget: list
        required: false
        fields:
          - { label: Title, name: title, widget: string }
          - label: Link
            name: url
            widget: string
            required: false
            pattern:
              - "^\\s*$|^(https?://)?[\\w.-]+\\.[a-z]{2,}(/\\S*)?\\s*$"
              - "Paste the address only, e.g. https://example.com/page — not a sentence."
        hint: "Primary papers and references behind the proposition."
      - label: Given
        name: given
        widget: relation
        collection: elementa
        search_fields: [ statement ]
        display_fields: [ statement ]
        value_field: "{{slug}}"
        multiple: true
        required: false
        hint: "Propositions this one depends on. Builds the dependency graph."
      - label: Figure
        name: figure
        widget: select
        required: false
        options:
          - FigPipelineHierarchiRetina
          - FigModelAsFunction
          - FigTensorShape
          - FigParameterSpace
          - FigLossLandscape
          - FigGeneralisation
          - FigNeuron
          - FigDepthFolds
          - FigComputationalGraph
          - FigDescentStep
          - FigRegularisation
          - FigTokenBoundary
          - FigBPEMerge
          - FigEmbeddingSpace
          - FigContextualisation
          - FigRecurrentState
          - FigVanishingGradient
          - FigGating
          - FigDilation
          - FigSequenceLineage
          - FigAttentionWeights
          - FigQKV
          - FigSoftmaxTemperature
          - FigSelfVsCross
          - FigAttentionCost
          - FigPermutation
          - FigSinusoid
          - FigRoPE
          - FigExtrapolation
          - FigTransformerBlock
          - FigMultiHead
          - FigResidualStream
          - FigPrePostNorm
          - FigCausalMask
          - FigEncoderDecoder
          - FigBatchNoise
          - FigSchedule
          - FigClipping
          - FigPrecision
          - FigSplitLeak
          - FigTransformerMap
        hint: "Registered in src/lib/figures.ts, and checked against it by `npm run check:cms`. A new figure needs a developer."
      - label: Status
        name: status
        widget: select
        default: draft
        options:
          - { label: "Draft — hidden from the live site", value: draft }
          - { label: "Published", value: published }
      - label: Updated
        name: updated
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: Demonstration
        name: body
        widget: markdown

  # ------------------------------------------------------------------
  - name: works
    label: Plates
    label_singular: Plate
    description: >-
      The research plates. These are what the Compendium on the home page shows — add one here and a card appears there. The plate number is both the sort order and the numeral on the page, so keep them consecutive.
    folder: src/content/works
    extension: mdx
    format: frontmatter
    create: true
    delete: true
    identifier_field: title
    summary: "Plate {{plate}} — {{title}}"
    sortable_fields: [ plate ]
    fields:
      - label: Plate number
        name: plate
        widget: number
        value_type: int
        min: 1
        hint: >-
          Both the sort order and the numeral on the page — Plate 5 renders as "Plate V". Keep them consecutive so the compendium reads cleanly.
      - { label: Short title, name: title, widget: string }
      - { label: Full title, name: fullTitle, widget: text }
      - { label: Subtitle, name: subtitle, widget: string }
      - label: Status
        name: status
        widget: select
        default: in-preparation
        options:
          - { label: "In preparation", value: in-preparation }
          - { label: "Proposal accepted", value: proposal-accepted }
          - { label: "Deposited", value: deposited }
      - label: Disclosure
        name: disclosure
        widget: select
        default: embargoed
        options:
          - { label: "Embargoed — results stay off the page", value: embargoed }
          - { label: "Public — results may be shown", value: public }
        hint: >-
          EMBARGOED plates must have an empty Results table. Adding a result to an embargoed plate will deliberately fail the build so unpublished numbers cannot leak.
      - { label: Year, name: year, widget: string, default: "2026" }
      - label: Supervisors
        name: supervisors
        widget: list
        field: { label: Name, name: name, widget: string }
        hint: "At least one — the schema requires it."
      - { label: Co-authors, name: coauthors, widget: list, required: false, field: { label: Name, name: name, widget: string } }
      - { label: Datasets, name: datasets, widget: list, required: false, field: { label: Dataset, name: dataset, widget: string } }
      - label: Abstract
        name: abstract
        widget: text
        hint: "Verbatim from the paper. Never paraphrase or shorten it."
      - { label: Citation, name: citation, widget: text, required: false }
      - { label: Paper URL, name: paperUrl, widget: string, required: false, pattern: [ "^\\s*$|^(https?://)?[\\w.-]+\\.[a-z]{2,}(/\\S*)?\\s*$", "Paste the address only, e.g. https://example.com/page — not a sentence." ], hint: The address only. A sentence with a link in it will not be accepted here. }
      - { label: Repository URL, name: repoUrl, widget: string, required: false, pattern: [ "^\\s*$|^(https?://)?[\\w.-]+\\.[a-z]{2,}(/\\S*)?\\s*$", "Paste the address only, e.g. https://example.com/page — not a sentence." ], hint: The address only. A sentence with a link in it will not be accepted here. }
      - label: Results
        name: metrics
        widget: list
        required: false
        label_singular: Result
        summary: "{{fields.label}} — {{fields.value}}"
        hint: "Leave completely empty for embargoed plates. The build enforces this."
        fields:
          - { label: Measure, name: label, widget: string }
          - { label: Value, name: value, widget: string }
          - { label: Note, name: note, widget: string, required: false }
      - { label: Chapter body, name: body, widget: markdown }

  # ------------------------------------------------------------------
  - name: art
    label: Tabulae
    label_singular: Plate
    description: >-
      The artwork interleaved between the chapters. Upload an image, say where it came from, and write as much history as you like in the note.
    folder: src/content/art
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{order}} · {{title}} — {{artist}}"
    sortable_fields: [ order, title, artist ]
    # Relative to this collection's folder, so uploads land in
    # src/assets/plates and the saved path is one Astro can optimise.
    media_folder: "../../assets/plates"
    public_folder: "../../assets/plates"
    fields:
      - label: Image
        name: image
        widget: image
        hint: "Uploads are optimised automatically. Large scans are fine."
      - label: Title
        name: title
        widget: string
      - label: Artist
        name: artist
        widget: string
        default: Unknown
      - label: Date
        name: date
        widget: string
        hint: "As the source gives it, e.g. 1514, or c. 12th century."
      - label: Plate order
        name: order
        widget: number
        value_type: int
        min: 1
        hint: >-
          Sort order only. Lowest sits on the frontispiece; the rest interleave the chapters. Gaps are fine — the plate numbers on the page are worked out from the running order, not from this value.
      - label: Treatment
        name: treatment
        widget: select
        default: intaglio
        options:
          - { label: "Intaglio — line art, prints onto the page", value: intaglio }
          - { label: "Photograph — an object, toned instead", value: photograph }
        hint: >-
          Engravings and drawings on white paper should be intaglio. Photographs of sculpture or objects should be photograph, or they will go black.
      - label: Gloss
        name: gloss
        widget: text
        hint: "One line, set in italic beneath the caption."
      - label: Alt text
        name: alt
        widget: string
        required: false
        hint: "For screen readers. Leave blank to use the title and artist."
      - label: Credit
        name: credit
        widget: string
        default: "Art Institute of Chicago · CC0"
        hint: "Who holds it, and the licence. Only use images you are allowed to publish."
      - label: Source link
        name: source
        widget: string
        required: false
        pattern:
          - ^\s*$|^(https?://)?[\w.-]+\.[a-z]{2,}(/\S*)?\s*$
          - Paste the address only, e.g. https://example.com/page — not a sentence.
        hint: The address only. A sentence with a link in it will not be accepted here.
      - label: Position on the home page
        name: homePosition
        widget: number
        value_type: float
        step: 0.5
        min: 0
        default: 1
        hint: >-
          1 appears first, beside your name at the top; 2 next, and so on down
          the page. To slot a plate between two others, use a half — 3.5 puts
          it straight after 3 and moves everything below it down. Typing a
          number another plate already has leaves that one in front, so use
          the half instead.
      - label: Side
        name: side
        widget: select
        default: right
        options: [ left, right ]
        hint: "Which margin it hangs in on the home page."
      - label: Show on the home page
        name: onHome
        widget: boolean
        default: true
        hint: >-
          The only switch that decides this. Off means it stays in the Tabulae gallery but never appears on the home page.
      - label: Status
        name: status
        widget: select
        default: published
        options:
          - { label: "Draft — hidden from the live site", value: draft }
          - { label: "Published", value: published }
      - label: Note — description and historical background
        name: body
        widget: markdown
        hint: "Where it came from, what is happening in it, why it is here."

  # ------------------------------------------------------------------
  - name: axioms
    label: Axioms
    label_singular: Axiom
    description: >-
      The maxims on the home page. Each names the project it came from. A maxim that needs defending is not a maxim, so there is no room here for an explanation.
    folder: src/content/axioms
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: text
    slug: "{{slug}}"
    summary: "{{order}} · {{text}}"
    sortable_fields: [ order ]
    fields:
      - { label: The maxim, name: text, widget: text }
      - label: Where it came from
        name: cite
        widget: string
        hint: "Set in the margin, e.g. HierarchiRetina, Stage III."
      - { label: Order, name: order, widget: number, value_type: int, min: 1 }

  # ------------------------------------------------------------------
  - name: images
    label: Imagines
    label_singular: Image
    description: >-
      Photographs, shown on the Imagines page with a caption and, if you want one, a longer note. For engravings and paintings use Tabulae instead.
    folder: src/content/images
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: caption
    slug: "{{slug}}"
    summary: "{{order}} · {{caption}}"
    sortable_fields: [ order, caption ]
    media_folder: "../../assets/images"
    public_folder: "../../assets/images"
    fields:
      - label: Image
        name: image
        widget: image
        hint: "Uploaded images are optimised automatically."
      - label: Caption
        name: caption
        widget: string
        hint: "Shown under the picture. Required."
      - label: About this image
        name: about
        widget: text
        required: false
        hint: "Optional. Where it was taken, what is happening, why it is here."
      - label: Alt text
        name: alt
        widget: string
        required: false
        hint: "For screen readers. Leave blank to use the caption."
      - label: Credit
        name: credit
        widget: string
        required: false
        hint: "Photographer or source, if there is one to name."
      - label: Order
        name: order
        widget: number
        value_type: int
        min: 1
        default: 1
      - label: Status
        name: status
        widget: select
        default: published
        options:
          - { label: "Draft — hidden from the live site", value: draft }
          - { label: "Published", value: published }

  # ------------------------------------------------------------------
  - name: papers
    label: Published papers
    label_singular: Paper
    description: >-
      Papers and manuscripts. Add one here when it goes out, and paste the link when it appears. This drives the Papers page and the downloadable CV.
    folder: src/content/papers
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{year}} · {{title}}"
    sortable_fields: [ year, title ]
    fields:
      - { label: Title, name: title, widget: string }
      - label: Authors
        name: authors
        widget: list
        required: false
        field: { label: Name, name: name, widget: string }
      - label: State
        name: state
        widget: select
        default: in-preparation
        options:
          - { label: "In preparation", value: in-preparation }
          - { label: "Under review", value: under-review }
          - { label: "Preprint", value: preprint }
          - { label: "Published", value: published }
      - { label: Year, name: year, widget: string, default: "2026" }
      - label: Venue
        name: venue
        widget: string
        required: false
        hint: "Journal, conference or repository. Leave blank until there is one."
      - label: Link
        name: url
        widget: string
        required: false
        hint: "The address only. A sentence with a link in it will not be accepted here."
        pattern:
          - ^\s*$|^(https?://)?[\w.-]+\.[a-z]{2,}(/\S*)?\s*$
          - Paste the address only, e.g. https://example.com/page — not a sentence.
      - { label: DOI, name: doi, widget: string, required: false }
      - label: One line on what it does
        name: summary
        widget: text
      - label: Status
        name: status
        widget: select
        default: published
        options:
          - { label: "Draft — hidden from the live site", value: draft }
          - { label: "Published", value: published }

  # ------------------------------------------------------------------
  - name: education
    label: Education
    label_singular: Entry
    description: "Shown in the Chronicle, on the Vitae page and in the CV."
    folder: src/content/education
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: degree
    slug: "{{slug}}"
    summary: "{{order}} · {{degree}}"
    sortable_fields: [ order ]
    fields:
      - { label: Degree or certificate, name: degree, widget: string }
      - { label: Institution, name: institution, widget: string }
      - { label: Location, name: location, widget: string }
      - { label: Period, name: period, widget: string, hint: "e.g. Fall 2021 – Summer 2026" }
      - { label: Detail, name: detail, widget: text, required: false }
      - label: Result
        name: result
        widget: string
        required: false
        hint: >-
          CGPA or GPA. Appears on the Vitae page and in the downloadable CV,
          but not in the Chronicle on the home page.
      - { label: Order, name: order, widget: number, value_type: int, min: 1 }

  # ------------------------------------------------------------------
  - name: projects
    label: Engineering projects
    label_singular: Project
    description: "Shown in the Appendix, and on the CV in shorter form."
    folder: src/content/projects
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{order}} · {{title}}"
    sortable_fields: [ order, title ]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: summary, widget: text, hint: "The fuller version, shown in the Appendix." }
      - label: Short version for the CV
        name: cvSummary
        widget: text
        required: false
        hint: "Leave blank to reuse the description."
      - { label: Order, name: order, widget: number, value_type: int, min: 1 }

  # ------------------------------------------------------------------
  - name: instrumentarium
    label: Instrumentarium
    label_singular: Group
    description: >-
      The instrument plate on the home page. Each group is a numbered figure. No bars, no percentages, no logos — that is the point of it.
    folder: src/content/instrumentarium
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{order}} · {{title}}"
    sortable_fields: [ order, title ]
    fields:
      - { label: Group, name: title, widget: string, hint: "Languages, Deep learning, Evaluation…" }
      - label: Contents
        name: items
        widget: text
        hint: "The tools and techniques themselves, as a sentence or a list."
      - label: Note on actual use
        name: note
        widget: string
        hint: "One line. What you really do with these."
      - label: Order
        name: order
        widget: number
        value_type: int
        min: 1
        hint: "Sort order only. Figure numbers come from the running order."

  # ------------------------------------------------------------------
  - name: instrumenta
    label: Instrumenta propria
    label_singular: Entry
    description: >-
      Architectures and losses written from scratch. Each entry states the design problem, then the decision.
    folder: src/content/instrumenta
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: name
    slug: "{{slug}}"
    summary: "{{order}} · {{name}}"
    sortable_fields: [ order, name ]
    fields:
      - { label: Name, name: name, widget: string }
      - label: The design problem
        name: problem
        widget: text
        hint: "Set in italic. Why the obvious approach does not work."
      - label: The decision
        name: decision
        widget: text
      - label: Rejected along the way
        name: rejections
        widget: list
        required: false
        field: { label: What was rejected, name: item, widget: string }
        hint: >-
          Things that made the result worse. Negative results are the part nobody publishes and everybody respects — leave empty if there are none.
      - label: Order
        name: order
        widget: number
        value_type: int
        min: 1

  # ------------------------------------------------------------------
  - name: site
    label: Site text
    description: Prose that appears on the home page.
    files:
      - name: prologue
        label: Prologue
        file: src/content/site/prologue.mdx
        extension: mdx
        format: frontmatter
        fields:
          - { label: Heading, name: title, widget: string }
          - label: Drop cap
            name: dropCap
            widget: boolean
            default: true
            hint: "Sets the first letter three lines deep, as a printed book does."
          - label: Prologue
            name: body
            widget: markdown
            hint: "Use the image button in the toolbar to add pictures."
      - name: instrumentarium
        label: Instrumentarium closing line
        file: src/content/site/instrumentarium.mdx
        extension: mdx
        format: frontmatter
        fields:
          - { label: Heading, name: title, widget: string }
          - label: "Not yet"
            name: notYet
            widget: string
            hint: >-
              The line admitting what is missing. A skills list that visibly excludes things is more credible than one that does not.
      - name: colophon
        label: Colophon
        file: src/content/site/colophon.mdx
        extension: mdx
        format: frontmatter
        fields:
          - { label: Heading, name: title, widget: string }
          - { label: Colophon, name: body, widget: markdown }
      - name: cv
        label: CV summary
        file: src/content/site/cv.mdx
        extension: mdx
        format: frontmatter
        fields:
          - { label: Heading, name: title, widget: string }
          - label: Summary
            name: summary
            widget: text
            hint: "The opening paragraph of the downloadable CV."
          - { label: Languages, name: languages, widget: text }
      - name: contact
        label: Contact details
        file: src/content/site/contact.mdx
        extension: mdx
        format: frontmatter
        fields:
          - { label: Heading, name: title, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: GitHub, name: github, widget: string, pattern: [ "^\\s*$|^(https?://)?[\\w.-]+\\.[a-z]{2,}(/\\S*)?\\s*$", "Paste the address only, e.g. https://example.com/page — not a sentence." ], hint: The address only. A sentence with a link in it will not be accepted here. }
          - { label: LinkedIn, name: linkedin, widget: string, pattern: [ "^\\s*$|^(https?://)?[\\w.-]+\\.[a-z]{2,}(/\\S*)?\\s*$", "Paste the address only, e.g. https://example.com/page — not a sentence." ], hint: The address only. A sentence with a link in it will not be accepted here. }
          - { label: Location, name: location, widget: string }
      - name: chronicle
        label: Chronicle coursework
        file: src/content/site/chronicle.mdx
        extension: mdx
        format: frontmatter
        fields:
          - { label: Heading, name: title, widget: string }
          - { label: Coursework, name: coursework, widget: text }
      - name: elementa
        label: Elementa introductions
        file: src/content/site/elementa.mdx
        extension: mdx
        format: frontmatter
        fields:
          - { label: Heading, name: title, widget: string }
          - label: Kicker
            name: kicker
            widget: string
            hint: >-
              The small line above the title. Say what the subject is — a visitor should not have to guess that this is about deep learning.
          - label: On the Elementa page
            name: lede
            widget: text
            hint: >-
              Avoid naming a number of books here — you can add more, and the text would go stale.
          - { label: On the home page, name: homeIntro, widget: text }
      - name: frontispiece
        label: Frontispiece
        file: src/content/site/frontispiece.mdx
        extension: mdx
        format: frontmatter
        fields:
          - { label: Heading, name: title, widget: string }
          - { label: Role line, name: role, widget: text }
          - { label: Epigraph, name: epigraph, widget: text }
          - { label: Attributed to, name: attribution, widget: string }
          - { label: Location, name: location, widget: string }
