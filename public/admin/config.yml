    label_singular: Project
    description: "Shown in the Appendix, and on the CV in shorter form."
    folder: src/content/projects
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{order}} · {{title}}"
    sortable_fields: [ order, title ]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: summary, widget: text, hint: "The fuller version, shown in the Appendix." }
      - label: Short version for the CV
        name: cvSummary
        widget: text
        required: false
        hint: "Leave blank to reuse the description."
      - { label: Order, name: order, widget: number, value_type: int, min: 1 }

  # ------------------------------------------------------------------
  - name: instrumentarium
    label: Instrumentarium
    label_singular: Group
    description: >-
      The instrument plate on the home page. Each group is a numbered figure. No bars, no percentages, no logos — that is the point of it.
    folder: src/content/instrumentarium
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{order}} · {{title}}"
    sortable_fields: [ order, title ]
    fields:
      - { label: Group, name: title, widget: string, hint: "Languages, Deep learning, Evaluation…" }
      - label: Contents
        name: items
        widget: text
        hint: "The tools and techniques themselves, as a sentence or a list."
      - label: Note on actual use
        name: note
        widget: string
        hint: "One line. What you really do with these."
      - label: Order
        name: order
        widget: number
        value_type: int
        min: 1
        hint: "Sort order only. Figure numbers come from the running order."

  # ------------------------------------------------------------------
  - name: instrumenta
    label: Instrumenta propria
    label_singular: Entry
    description: >-
      Architectures and losses written from scratch. Each entry states the design problem, then the decision.
    folder: src/content/instrumenta
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: name
    slug: "{{slug}}"
    summary: "{{order}} · {{name}}"
    sortable_fields: [ order, name ]
    fields:
      - { label: Name, name: name, widget: string }
      - label: The design problem
        name: problem
        widget: text
        hint: "Set in italic. Why the obvious approach does not work."
      - label: The decision
        name: decision
        widget: text
      - label: Rejected along the way
        name: rejections
        widget: list
        required: false
        field: { label: What was rejected, name: item, widget: string }
        hint: >-
          Things that made the result worse. Negative results are the part nobody publishes and everybody respects — leave empty if there are none.
      - label: Order
        name: order
        widget: number
        value_type: int
        min: 1

  # ------------------------------------------------------------------
  - name: site
    label: Site text
    description: Prose that appears on the home page.
    files:
      - name: prologue
        label: Prologue
        file: src/content/site/prologue.mdx
        extension: mdx
        format: frontmatter
        fields:
          - { label: Heading, name: title, widget: string }
          - label: Drop cap
            name: dropCap
            widget: boolean
            default: true
            hint: "Sets the first letter three lines deep, as a printed book does."
          - label: Prologue
            name: body
            widget: markdown
            hint: "Use the image button in the toolbar to add pictures."
      - name: instrumentarium
        label: Instrumentarium closing line
        file: src/content/site/instrumentarium.mdx
        extension: mdx
        format: frontmatter
        fields:
          - { label: Heading, name: title, widget: string }
          - label: "Not yet"
            name: notYet
            widget: string
            hint: >-
              The line admitting what is missing. A skills list that visibly excludes things is more credible than one that does not.
      - name: colophon
        label: Colophon
        file: src/content/site/colophon.mdx
        extension: mdx
        format: frontmatter
        fields:
          - { label: Heading, name: title, widget: string }
          - { label: Colophon, name: body, widget: markdown }
      - name: cv
        label: CV summary
        file: src/content/site/cv.mdx
        extension: mdx
        format: frontmatter
        fields:
          - { label: Heading, name: title, widget: string }
          - label: Summary
            name: summary
            widget: text
            hint: "The opening paragraph of the downloadable CV."
          - { label: Languages, name: languages, widget: text }
      - name: contact
        label: Contact details
        file: src/content/site/contact.mdx
        extension: mdx
        format: frontmatter
        fields:
          - { label: Heading, name: title, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: GitHub, name: github, widget: string, pattern: [ "^\\s*$|^(https?://)?[\\w.-]+\\.[a-z]{2,}(/\\S*)?\\s*$", "Paste the address only, e.g. https://example.com/page — not a sentence." ], hint: The address only. A sentence with a link in it will not be accepted here. }
          - { label: LinkedIn, name: linkedin, widget: string, pattern: [ "^\\s*$|^(https?://)?[\\w.-]+\\.[a-z]{2,}(/\\S*)?\\s*$", "Paste the address only, e.g. https://example.com/page — not a sentence." ], hint: The address only. A sentence with a link in it will not be accepted here. }
          - { label: Location, name: location, widget: string }
      - name: chronicle
        label: Chronicle coursework
        file: src/content/site/chronicle.mdx
        extension: mdx
        format: frontmatter
        fields:
          - { label: Heading, name: title, widget: string }
          - { label: Coursework, name: coursework, widget: text }
      - name: elementa
        label: Elementa introductions
        file: src/content/site/elementa.mdx
        extension: mdx
        format: frontmatter
        fields:
          - { label: Heading, name: title, widget: string }
          - label: Kicker
            name: kicker
            widget: string
            hint: >-
              The small line above the title. Say what the subject is — a visitor should not have to guess that this is about deep learning.
          - label: On the Elementa page
            name: lede
            widget: text
            hint: >-
              Avoid naming a number of books here — you can add more, and the text would go stale.
          - { label: On the home page, name: homeIntro, widget: text }
      - name: tabulae
        label: Tabulae introduction
        file: src/content/site/tabulae.mdx
        extension: mdx
        format: frontmatter
        fields:
          - { label: Heading, name: title, widget: string }
          - label: Kicker
            name: kicker
            widget: string
            hint: "The small line above the title, e.g. The plates."
          - label: Introduction
            name: lede
            widget: text
            hint: >-
              The paragraph under the title on the Tabulae page. Avoid naming a
              number of plates — you add them from Tabulae and the text would go
              stale.
      - name: frontispiece
        label: Frontispiece
        file: src/content/site/frontispiece.mdx
        extension: mdx
        format: frontmatter
        fields:
          - { label: Heading, name: title, widget: string }
          - { label: Role line, name: role, widget: text }
          - { label: Epigraph, name: epigraph, widget: text }
          - { label: Attributed to, name: attribution, widget: string }
          - { label: Location, name: location, widget: string }
